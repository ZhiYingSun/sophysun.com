  @font-face {

    font-style: normal;

  :root {
    --background: #fff;
    --foreground: #000;
    color-scheme: light;
  }

  *, *::before, *::after { box-sizing: border-box; }

  html { -webkit-text-size-adjust: 100%; }

  body {
    margin: 0;
    min-height: 100vh;
    background: var(--background);
    color: var(--foreground);
    font-family: "EB Garamond", Georgia, "Times New Roman", Times, serif;
    font-weight: 400;
    font-size: 1.0625rem;
    line-height: 1.35;
    -webkit-font-smoothing: antialiased;
    -moz-osx-font-smoothing: grayscale;
  }

  /* left-anchored column */
  .page {
    width: 100%;
    max-width: 42rem;
    padding: 2rem 1.25rem 4rem;
  }

  @media (min-width: 640px) {
    .page { padding-left: 4rem; padding-top: 4rem; }
  }

  a {
    color: inherit;
    text-decoration: underline;
    text-underline-offset: 0.12em;
  }

  h1 {
    margin: 0 0 1.75rem;
    font-size: 1.0625rem;
    font-weight: 600;
    letter-spacing: 0.01em;
  }

  .intro { max-width: 32rem; }
  .intro p { margin: 0 0 0.35rem; }

  section { margin-top: 1.75rem; max-width: 32rem; }

  h2 {
    margin: 0;
    font-size: 1.0625rem;
    font-weight: 600;
  }

  ul {
    margin: 0.4rem 0 0;
    padding: 0;
    list-style: none;
  }

  li { margin-bottom: 0.4rem; }

  .label { font-style: italic; }

  @media (max-width: 639px) {
    body { font-size: 1rem; }
    h1, h2 { font-size: 1rem; }
  }
